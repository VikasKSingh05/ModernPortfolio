version: 2
updates:
  # Keep GitHub Actions (the `uses:` in .github/workflows) up to date. Dependabot
  # bumps the pinned commit SHA and the `# vX.Y.Z` comment together, and opens
  # PRs against main so they flow through the PR CI gate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Collapse all action bumps into a single PR to reduce noise.
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  # Keep the npm dependencies patched. Grouped into one PR per month to reduce
  # noise; security updates still arrive out-of-band.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    versioning-strategy: increase
